<head>

  <style>
    body {
      background: #151522;

      padding: 45px 20px;

    button {
      background: #d94e91;

    #status {

<body>
  <h2>💕 Mia Sara</h2>
  <p>PROJECT N.A.D.I.A</p>
  <p>Ujian mikrofon Apis sayang 🎙️</p>

  <button onclick="testMic()">
    🎤 Semak Mikrofon
  </button>

  <p id="status">Belum diuji</p>

  <script>
    async function testMic() {
      const status = document.getElementById("status");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });
        status.textContent = "✅ Mikrofon berjaya! Mia boleh menerima audio melalui pelayar.";
        stream.getTracks().forEach(track => track.stop());
      } catch (error) {
        status.textContent = "❌ " + error.name + ": " + error.message;
      }
    }
  </script>
